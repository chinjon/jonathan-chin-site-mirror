{% extends "layouts/base.html" %}

{% set pageHeaderTitle = title %}

{% block content %}
	<article class="post-container h-entry">
			{% include "partials/page-header.html" %}
					<a class="hidden-item u-url">{{site.url}}{{page.url}}</a>
			<p class="dt-published">published: {{date}}</p>
		<div class="e-content">
			{{ content | safe }}
		</div>
	</article>

{% endblock %}
